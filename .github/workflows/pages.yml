# 把静态站点直接发布到 GitHub Pages。
#
# 为什么不用 Pages 自带的 legacy 构建：本仓库通过 Git Data API 推送
# （本机到 github.com:443 的 git 传输被网络阻断），legacy 构建未被触发，
# 且触发接口持续返回 500。改用 Actions 部署，状态与日志都可查。
#
# 这是一个纯静态站：没有构建步骤，把仓库根目录整体作为产物上传即可。
# `.nojekyll` 让 GitHub 跳过 Jekyll 处理。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
